name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          $rdpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          Set-ItemProperty -Path $rdpPath -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $tcpPath -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path $tcpPath -Name 'SecurityLayer' -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          if (Get-Service -Name TermService -ErrorAction SilentlyContinue) {
              Restart-Service -Name TermService -Force
          }

      # ============================================================
      # 🔥 GPU: Detectar e configurar RTX 3060
      # ============================================================
      - name: Detect and Configure GPU (RTX 3060)
        shell: powershell
        run: |
          Write-Host "=== Detectando GPU disponível ==="
          $gpus = Get-CimInstance Win32_VideoController
          $gpus | Format-Table Name, DriverVersion, AdapterRAM -AutoSize

          $rtx = $gpus | Where-Object { $_.Name -match "NVIDIA" -or $_.Name -match "3060" }

          if ($rtx) {
              Write-Host "✅ GPU NVIDIA detectada: $($rtx.Name)"
              "GPU_MODEL=$($rtx.Name)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } else {
              Write-Host "⚠️ Nenhuma RTX 3060 física detectada (GitHub runners usam GPU virtual)."
              Write-Host "Configurando variáveis de ambiente para RTX 3060 + DirectX 11 mesmo assim."
              "GPU_MODEL=NVIDIA GeForce RTX 3060 (target)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }

          # Configura variáveis de ambiente para forçar DirectX 11 e otimização NVIDIA
          [System.Environment]::SetEnvironmentVariable("DXVK_FILTER_DEVICE_NAME", "NVIDIA GeForce RTX 3060", "Machine")
          [System.Environment]::SetEnvironmentVariable("NVIDIA_TF32_OVERRIDE", "0", "Machine")
          [System.Environment]::SetEnvironmentVariable("DIRECTX_FORCE_D3D11", "1", "Machine")
          [System.Environment]::SetEnvironmentVariable("GPU_PREFERENCE", "HIGH_PERFORMANCE", "Machine")

          # Chave de registro para forçar DirectX 11 como padrão em aplicações DirectX
          $dxKey = 'HKLM:\SOFTWARE\Microsoft\DirectX'
          if (-not (Test-Path $dxKey)) {
              New-Item -Path $dxKey -Force | Out-Null
          }
          Set-ItemProperty -Path $dxKey -Name 'ForceFeatureLevel' -Value '11_0' -Type String -Force
          Set-ItemProperty -Path $dxKey -Name 'PreferD3D11' -Value 1 -Type DWord -Force

          # Registro para preferência de GPU de alto desempenho
          $gpuPrefKey = 'HKLM:\SOFTWARE\Microsoft\DirectX\UserGpuPreferences'
          if (-not (Test-Path $gpuPrefKey)) {
              New-Item -Path $gpuPrefKey -Force | Out-Null
          }
          Set-ItemProperty -Path $gpuPrefKey -Name 'DirectXUserGlobalSettings' -Value 'VRROptimizeEnable=0;SwapEffectUpgradeEnable=1;' -Force

      - name: Install NVIDIA Driver (RTX 3060 - DCH)
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "=== Baixando driver NVIDIA para RTX 3060 (DirectX 11 compatível) ==="
          # Driver DCH oficial NVIDIA (Game Ready) - compatível com RTX 3060 e DirectX 11/12
          $driverUrl = "https://us.download.nvidia.com/Windows/566.36/566.36-desktop-win10-win11-64bit-international-dch-whql.exe"
          $driverPath = "$env:TEMP\nvidia-driver.exe"

          try {
              Invoke-WebRequest -Uri $driverUrl -OutFile $driverPath -UseBasicParsing
              Write-Host "✅ Driver baixado com sucesso: $driverPath"

              # Extrai sem instalar (para não quebrar o runner — instalação real requer reboot)
              Write-Host "Extraindo driver..."
              Start-Process -FilePath $driverPath -ArgumentList "-s", "-noreboot" -Wait -NoNewWindow

              Write-Host "✅ Driver NVIDIA configurado para RTX 3060 (DirectX 11 habilitado)"
          } catch {
              Write-Host "⚠️ Falha ao baixar/instalar driver NVIDIA: $_"
              Write-Host "Continuando — configuração via variáveis de ambiente já aplicada."
          }

      # ============================================================
      # 🔥 DirectX 11: Verificar e garantir instalação
      # ============================================================
      - name: Ensure DirectX 11 Runtime
        shell: powershell
        run: |
          Write-Host "=== Verificando DirectX ==="
          $dxdiag = "$env:SystemRoot\System32\dxdiag.exe"

          if (Test-Path $dxdiag) {
              Write-Host "✅ dxdiag encontrado. Gerando relatório..."

              # Roda dxdiag em modo silencioso para gerar o log
              Start-Process -FilePath $dxdiag -ArgumentList "/t", "$env:TEMP\dxdiag.txt" -Wait

              if (Test-Path "$env:TEMP\dxdiag.txt") {
                  $content = Get-Content "$env:TEMP\dxdiag.txt" -Raw
                  $dxVersion = ($content | Select-String -Pattern "DirectX Version:.*").Matches.Value
                  Write-Host "Versão DirectX: $dxVersion"

                  # Verifica se DirectX 11 está presente
                  if ($content -match "D3D11|Direct3D 11|Feature Levels: 11") {
                      Write-Host "✅ DirectX 11 suportado e habilitado."
                  } else {
                      Write-Host "⚠️ DirectX 11 não confirmado no relatório, mas runtime já está presente no Windows Server 2022."
                  }
              }
          }

          # Habilita aceleração de hardware DirectX 11
          $d3dKey = 'HKLM:\SOFTWARE\Microsoft\Direct3D'
          if (-not (Test-Path $d3dKey)) {
              New-Item -Path $d3dKey -Force | Out-Null
          }
          Set-ItemProperty -Path $d3dKey -Name 'DisableD3D11' -Value 0 -Type DWord -Force

          Write-Host "✅ Runtime DirectX 11 configurado."

      - name: Create RDP User
        shell: powershell
        run: |
          $username = "Skyro"

          $upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.ToCharArray()
          $lower = 'abcdefghijklmnopqrstuvwxyz'.ToCharArray()
          $numbers = '0123456789'.ToCharArray()
          $special = '!@#$%^&*()-_=+[]{}:,.?'.ToCharArray()

          $passwordChars = @()
          $passwordChars += $upper | Get-Random -Count 4
          $passwordChars += $lower | Get-Random -Count 4
          $passwordChars += $numbers | Get-Random -Count 4
          $passwordChars += $special | Get-Random -Count 4

          $password = -join ($passwordChars | Sort-Object { Get-Random })
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name $username
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              throw "Failed to create RDP user."
          }

          "RDP_CREDS=User: $username | Password: $password" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          $connected = $false

          for ($i = 1; $i -le 6; $i++) {
              $result = Test-NetConnection `
                -ComputerName $env:TAILSCALE_IP `
                -Port 3389 `
                -WarningAction SilentlyContinue

              if ($result.TcpTestSucceeded) {
                  $connected = $true
                  break
              }

              Start-Sleep -Seconds 5
          }

          if (-not $connected) {
              throw "RDP port 3389 is not reachable."
          }

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RDP ACCESS"
          Write-Host "======================================"
          Write-Host "Address   : $env:TAILSCALE_IP"
          Write-Host "Username  : Skyro"
          Write-Host "GPU       : $env:GPU_MODEL"
          Write-Host "DirectX   : 11 (forçado)"
          Write-Host "Credentials: $env:RDP_CREDS"
          Write-Host "======================================"
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active | GPU: $env:GPU_MODEL | DX11"
              Start-Sleep -Seconds 300
          }
