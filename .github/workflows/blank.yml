name: Windows Cloud PC — Tailscale + RDP + RTX 3060 + DX11

on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciando Sistema Reforçado (Tailscale + RDP)
    runs-on: windows-latest
    timeout-minutes: 10080   # 7 dias

    env:
      # Força Node 24 (elimina o aviso de deprecation do Node 20)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      PROCESSOR_COUNT: 8
      OPENGL: "1"
      GITHUB_PRESERVE_WORKFLOW: true
      MEMORY_GB: 16

    steps:
      # ============================================================
      # 1. INFORMAÇÕES DO RUNNER
      # ============================================================
      - name: Diagnóstico do runner
        run: |
          Write-Host "===== SISTEMA ====="
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture, CsProcessors, CsTotalPhysicalMemory
          Write-Host "`n===== GPU (WMI) ====="
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, AdapterRAM

      # ============================================================
      # 2. HABILITAR ÁREA DE TRABALHO REMOTA (RDP)
      # ============================================================
      - name: Habilitar RDP no Windows
        run: |
          Write-Host "-> Habilitando Remote Desktop..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force

          Write-Host "-> Criando usuário 'dev' com senha forte..."
          $senha = ConvertTo-SecureString "Dev@RTX3060!2026" -AsPlainText -Force
          New-LocalUser -Name "dev" -Password $senha -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administradores" -Member "dev" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "dev" -ErrorAction SilentlyContinue

          Write-Host "[OK] RDP pronto na porta 3389."

      # ============================================================
      # 3. INSTALAR TAILSCALE
      # ============================================================
      - name: Instalar Tailscale
        run: |
          Write-Host "-> Baixando Tailscale..."
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\tailscale.msi" -UseBasicParsing

          Write-Host "-> Instalando Tailscale silenciosamente..."
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /quiet /norestart" -Wait

          Write-Host "-> Verificando instalação..."
          & "C:\Program Files\Tailscale\tailscale.exe" version

      # ============================================================
      # 4. CONECTAR À TAILSCALE
      # ============================================================
      - name: Conectar à Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if (-not $env:TAILSCALE_AUTHKEY) {
            Write-Host "❌ ERRO: secret TAILSCALE_AUTHKEY não configurado!"
            Write-Host "Vá em: Settings → Secrets and variables → Actions → New repository secret"
            Write-Host "Crie: TAILSCALE_AUTHKEY = sua chave gerada em https://login.tailscale.com/admin/settings/keys"
            exit 1
          }

          Write-Host "-> Conectando Tailscale..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTHKEY --hostname=rtx3060-cloud --accept-routes --advertise-tags=tag:ci

          Write-Host "-> Status da Tailscale:"
          & "C:\Program Files\Tailscale\tailscale.exe" status

          Write-Host "-> IP Tailscale desta máquina:"
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "🌐 IP: $ip" 
          Write-Host "🌐 Use esse IP no RDP: mstsc.exe /v:$ip"

      # ============================================================
      # 5. OTIMIZAÇÕES RTX 3060 + DIRECTX 11
      # ============================================================
      - name: Otimizar performance (RTX 3060 + DX11)
        continue-on-error: true
        run: |
          Write-Host "===== OTIMIZAÇÕES ====="

          Write-Host "-> Plano de energia ALTO DESEMPENHO..."
          powercfg /setactive SCHEME_MIN

          Write-Host "-> Prioridade DirectX 11..."
          $dxReg = "HKCU:\Software\Microsoft\DirectX\UserGpuPreferences"
          if (-not (Test-Path $dxReg)) { New-Item -Path $dxReg -Force | Out-Null }
          Set-ItemProperty -Path $dxReg -Name "DirectXUserGlobalSettings" `
            -Value "VRROptimizeEnable=0;SwapEffectUpgradeEnable=1;" -Force

          Write-Host "-> Verificando DLLs do DirectX 11..."
          $dxFiles = @(
            "C:\Windows\System32\d3d11.dll",
            "C:\Windows\System32\dxgi.dll",
            "C:\Windows\System32\d3dcompiler_47.dll"
          )
          foreach ($f in $dxFiles) {
            if (Test-Path $f) {
              Write-Host "[OK] $(Split-Path $f -Leaf)"
            } else {
              Write-Host "[FALTA] $(Split-Path $f -Leaf)"
            }
          }

          Write-Host "-> Telemetria off (DiagTrack)..."
          Stop-Service -Name "DiagTrack" -Force -ErrorAction SilentlyContinue
          Set-Service  -Name "DiagTrack" -StartupType Disabled -ErrorAction SilentlyContinue

          Write-Host "[OK] Otimizações aplicadas."

      # ============================================================
      # 6. MOSTRAR INFORMAÇÕES DE CONEXÃO
      # ============================================================
      - name: Mostrar dados de conexão
        run: |
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "================================================"
          Write-Host "  🔗 CONEXÃO RDP PRONTA"
          Write-Host "================================================"
          Write-Host "  IP Tailscale : $ip"
          Write-Host "  Usuário      : dev"
          Write-Host "  Senha        : Dev@RTX3060!2026"
          Write-Host "  Porta        : 3389"
          Write-Host ""
          Write-Host "  No seu PC (com Tailscale logado), rode:"
          Write-Host "     mstsc.exe /v:$ip"
          Write-Host "================================================"

      # ============================================================
      # 7. MONITORAMENTO CONTÍNUO (mantém RDP + Tailscale vivos)
      # ============================================================
      - name: Monitoramento Contínuo
        run: |
          while ($true) {
              # Garante que o RDP está ativo
              $rdp = (Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections").fDenyTSConnections
              if ($rdp -ne 0) {
                  Write-Host "⚠️ RDP caiu — reabilitando..."
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
              }

              # Garante que Tailscale está rodando
              $ts = Get-Process -Name "tailscaled" -ErrorAction SilentlyContinue
              if (-not $ts) {
                  Write-Host "⚠️ Tailscale caiu — reiniciando..."
                  Restart-Service -Name "Tailscale" -Force -ErrorAction SilentlyContinue
              }

              $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4 2>$null
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ✅ Online — IP: $ip"

              Start-Sleep -Seconds 60
          }

      # ============================================================
      # 8. LIMPEZA
      # ============================================================
      - name: Limpeza Segura
        if: always()
        run: |
          Remove-Item "$env:TEMP\tailscale.msi" -Force -ErrorAction SilentlyContinue
          Write-Host "Limpeza finalizada."
