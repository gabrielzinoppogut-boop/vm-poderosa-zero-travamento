name: Diagnóstico e Otimização — RTX 3060 + DirectX 11

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de execução'
        required: true
        default: 'completo'
        type: choice
        options:
          - completo
          - somente-diagnostico
          - somente-otimizacao
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * 0'   # Todo domingo às 03:00 UTC

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  LOG_DIR: '${{ github.workspace }}\\logs'

jobs:
  diagnostico-windows:
    name: Executar em Windows (RTX 3060 / DX11)
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================
      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install psutil colorama

      # ============================================================
      # 3. INFORMAÇÕES DO SISTEMA
      # ============================================================
      - name: Coletar informações do sistema
        run: |
          Write-Host "===== INFORMAÇÕES DO SISTEMA ====="
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture, CsProcessors, CsTotalPhysicalMemory
          Write-Host "`n===== CPU ====="
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed
          Write-Host "`n===== MEMÓRIA ====="
          Get-CimInstance Win32_PhysicalMemory | Select-Object Capacity, Speed, Manufacturer

      # ============================================================
      # 4. VERIFICAÇÃO DA GPU (RTX 3060)
      # ============================================================
      - name: Verificar GPU RTX 3060
        continue-on-error: true
        run: |
          Write-Host "===== VERIFICAÇÃO DA GPU ====="
          $smi = "C:\Windows\System32\nvidia-smi.exe"
          if (Test-Path $smi) {
            & $smi --query-gpu=name,driver_version,memory.total,temperature.gpu,utilization.gpu,power.draw --format=csv
            Write-Host "[OK] nvidia-smi executado com sucesso"
          } else {
            Write-Host "[AVISO] nvidia-smi não disponível neste runner (esperado em runner GitHub)."
          }

          Write-Host "`n===== GPUs detectadas via WMI ====="
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, AdapterRAM, VideoProcessor

      # ============================================================
      # 5. VERIFICAÇÃO DO DIRECTX 11
      # ============================================================
      - name: Verificar DirectX 11
        continue-on-error: true
        run: |
          Write-Host "===== VERIFICAÇÃO DIRECTX ====="

          $dxKeys = @(
            "HKLM:\SOFTWARE\Microsoft\DirectX",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\DirectX"
          )
          foreach ($key in $dxKeys) {
            if (Test-Path $key) {
              Get-ItemProperty -Path $key -ErrorAction SilentlyContinue |
                Select-Object Version, InstalledVersion
            }
          }

          Write-Host "`n===== DLLs DirectX 11 ====="
          $dxFiles = @(
            "C:\Windows\System32\d3d11.dll",
            "C:\Windows\System32\dxgi.dll",
            "C:\Windows\System32\d3dcompiler_47.dll",
            "C:\Windows\System32\dxva2.dll"
          )
          foreach ($f in $dxFiles) {
            if (Test-Path $f) {
              $ver = (Get-Item $f).VersionInfo.FileVersion
              Write-Host "[OK] $(Split-Path $f -Leaf) — versão $ver"
            } else {
              Write-Host "[FALTA] $(Split-Path $f -Leaf)"
            }
          }

      # ============================================================
      # 6. OTIMIZAÇÕES DE PERFORMANCE (sem firewall, sem TV)
      # ============================================================
      - name: Aplicar otimizações de performance
        if: ${{ github.event.inputs.modo != 'somente-diagnostico' }}
        continue-on-error: true
        run: |
          Write-Host "===== OTIMIZAÇÕES DE PERFORMANCE ====="

          # Plano de energia alto desempenho
          Write-Host "-> Ativando plano de energia ALTO DESEMPENHO..."
          powercfg /setactive SCHEME_MIN
          powercfg /list

          # Prioridade de GPU DirectX 11
          Write-Host "-> Ajustando prioridade DirectX 11..."
          $dxReg = "HKCU:\Software\Microsoft\DirectX\UserGpuPreferences"
          if (-not (Test-Path $dxReg)) { New-Item -Path $dxReg -Force | Out-Null }
          Set-ItemProperty -Path $dxReg -Name "DirectXUserGlobalSettings" `
            -Value "VRROptimizeEnable=0;SwapEffectUpgradeEnable=1;" -Force

          # Desativar indexação em background
          Write-Host "-> Reduzindo indexação..."
          Set-Service -Name "WSearch" -StartupType Manual -ErrorAction SilentlyContinue

          # Desativar telemetria (DiagTrack)
          Write-Host "-> Desativando telemetria..."
          Stop-Service -Name "DiagTrack" -Force -ErrorAction SilentlyContinue
          Set-Service  -Name "DiagTrack" -StartupType Disabled -ErrorAction SilentlyContinue

          # Otimizar Prefetch
          Write-Host "-> Otimizando Prefetch..."
          $pref = "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters"
          Set-ItemProperty -Path $pref -Name "EnablePrefetcher" -Value 3 -Type DWord -Force

          # Prioridade multimídia / GPU
          Write-Host "-> Ajustando prioridade multimídia..."
          $mm = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile"
          Set-ItemProperty -Path $mm -Name "SystemResponsiveness" -Value 0 -Type DWord -Force

          $games = "$mm\Tasks\Games"
          if (-not (Test-Path $games)) { New-Item -Path $games -Force | Out-Null }
          Set-ItemProperty -Path $games -Name "GPU Priority" -Value 8 -Type DWord -Force
          Set-ItemProperty -Path $games -Name "Priority"     -Value 6 -Type DWord -Force

          Write-Host "[OK] Otimizações aplicadas."

      # ============================================================
      # 7. LIMPEZA DE PROCESSOS PESADOS
      # ============================================================
      - name: Limpar processos pesados
        if: ${{ github.event.inputs.modo != 'somente-diagnostico' }}
        continue-on-error: true
        run: |
          Write-Host "===== LIMPEZA DE PROCESSOS ====="
          $procs = @("OneDrive", "Teams", "Cortana", "YourPhone")
          foreach ($p in $procs) {
            $found = Get-Process -Name $p -ErrorAction SilentlyContinue
            if ($found) {
              Stop-Process -Name $p -Force -ErrorAction SilentlyContinue
              Write-Host "[OK] $p finalizado"
            } else {
              Write-Host "[--] $p não estava rodando"
            }
          }

      # ============================================================
      # 8. TESTE DE ESTABILIDADE
      # ============================================================
      - name: Teste de estabilidade (10s)
        run: |
          Write-Host "===== TESTE DE ESTABILIDADE ====="
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $iter = 0
          $sum  = 0
          while ($sw.Elapsed.TotalSeconds -lt 10) {
            for ($i = 0; $i -lt 100000; $i++) {
              $sum += ($i * $i) % 7
            }
            $iter++
          }
          $sw.Stop()
          Write-Host "[OK] $iter ciclos em $([math]::Round($sw.Elapsed.TotalSeconds,2))s (checksum=$sum)"

      # ============================================================
      # 9. RELATÓRIO FINAL
      # ============================================================
      - name: Gerar relatório final
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path "$env:LOG_DIR" | Out-Null
          $relatorio = "$env:LOG_DIR\relatorio_final.txt"
          @"
          ============================================================
          RELATÓRIO FINAL — DIAGNÓSTICO RTX 3060 + DIRECTX 11
          ============================================================
          Data/Hora     : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
          Runner        : $env:RUNNER_OS
          Modo          : ${{ github.event.inputs.modo }}
          Commit        : ${{ github.sha }}
          Repositório   : ${{ github.repository }}
          ============================================================
          "@ | Out-File -FilePath $relatorio -Encoding UTF8
          Get-Content $relatorio

      - name: Upload de logs como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-diagnostico-rtx3060
          path: ${{ env.LOG_DIR }}
          retention-days: 7
