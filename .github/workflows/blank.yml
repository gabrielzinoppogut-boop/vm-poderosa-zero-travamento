name: Máquina Windows Online — Tailscale + RDP + RTX 3060 + DX11

on:
  workflow_dispatch:
    inputs:
      senha_rdp:
        description: 'Senha do usuário dev (deixe vazio para usar a padrão)'
        required: false
        default: ''

jobs:
  maquina:
    name: Iniciando Máquina Online
    runs-on: windows-latest
    timeout-minutes: 360   # 6h (limite real da conta grátis)

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      PROCESSOR_COUNT: 8
      MEMORY_GB: 16
      OPENGL: "1"

    steps:
      # ============================================================
      # 1. DIAGNÓSTICO INICIAL
      # ============================================================
      - name: Diagnóstico do runner
        run: |
          Write-Host "===== SISTEMA ====="
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          Write-Host "`n===== CPU ====="
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
          Write-Host "`n===== MEMÓRIA ====="
          Get-CimInstance Win32_PhysicalMemory | Select-Object Capacity, Speed
          Write-Host "`n===== GPU ====="
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion

      # ============================================================
      # 2. HABILITAR RDP + CRIAR USUÁRIO
      # ============================================================
      - name: Habilitar RDP e criar usuário
        run: |
          Write-Host "-> Habilitando Remote Desktop..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          Write-Host "-> Liberando porta 3389 (RDP)..."
          New-NetFirewallRule -DisplayName "RDP-Tailscale" -Direction Inbound `
            -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue

          Write-Host "-> Criando usuário 'dev'..."
          $senhaTexto = "${{ github.event.inputs.senha_rdp }}"
          if (-not $senhaTexto) { $senhaTexto = "${{ secrets.RDP_PASSWORD }}" }
          if (-not $senhaTexto) { $senhaTexto = "Dev@RTX3060!2026" }

          $senha = ConvertTo-SecureString $senhaTexto -AsPlainText -Force
          New-LocalUser -Name "dev" -Password $senha -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administradores" -Member "dev" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "dev" -ErrorAction SilentlyContinue

          Write-Host "[OK] RDP pronto na porta 3389."

      # ============================================================
      # 3. INSTALAR TAILSCALE
      # ============================================================
      - name: Instalar Tailscale
        run: |
          Write-Host "-> Baixando Tailscale..."
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "$env:TEMP\tailscale.msi" -UseBasicParsing

          Write-Host "-> Instalando silenciosamente..."
          Start-Process msiexec.exe `
            -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /quiet /norestart" -Wait

          Write-Host "-> Versão instalada:"
          & "C:\Program Files\Tailscale\tailscale.exe" version

      # ============================================================
      # 4. CONECTAR À TAILSCALE
      # ============================================================
      - name: Conectar à Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if (-not $env:TS_AUTHKEY) {
            Write-Host "❌ Secret TAILSCALE_AUTHKEY não configurado!"
            Write-Host "Settings → Secrets and variables → Actions → New secret"
            exit 1
          }

          Write-Host "-> Autenticando..."
          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="rtx3060-cloud-${{ github.run_id }}" `
            --accept-routes `
            --unattended

          Start-Sleep -Seconds 5

          Write-Host "`n===== STATUS ====="
          & "C:\Program Files\Tailscale\tailscale.exe" status

          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "`n🌐 IP TAILSCALE: $ip"

      # ============================================================
      # 5. OTIMIZAÇÕES RTX 3060 + DX11
      # ============================================================
      - name: Otimizar RTX 3060 + DirectX 11
        continue-on-error: true
        run: |
          Write-Host "-> Plano de energia ALTO DESEMPENHO..."
          powercfg /setactive SCHEME_MIN

          Write-Host "-> Prioridade DirectX 11..."
          $dxReg = "HKCU:\Software\Microsoft\DirectX\UserGpuPreferences"
          if (-not (Test-Path $dxReg)) { New-Item -Path $dxReg -Force | Out-Null }
          Set-ItemProperty -Path $dxReg -Name "DirectXUserGlobalSettings" `
            -Value "VRROptimizeEnable=0;SwapEffectUpgradeEnable=1;" -Force

          Write-Host "-> Verificando DLLs do DirectX 11..."
          @("d3d11.dll","dxgi.dll","d3dcompiler_47.dll") | ForEach-Object {
            $p = "C:\Windows\System32\$_"
            if (Test-Path $p) { Write-Host "[OK] $_" } else { Write-Host "[FALTA] $_" }
          }

          Write-Host "-> Telemetria off..."
          Stop-Service -Name "DiagTrack" -Force -ErrorAction SilentlyContinue
          Set-Service  -Name "DiagTrack" -StartupType Disabled -ErrorAction SilentlyContinue

          Write-Host "[OK] Otimizações aplicadas."

      # ============================================================
      # 6. MOSTRAR DADOS DE CONEXÃO
      # ============================================================
      - name: Mostrar dados de conexão
        run: |
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "================================================"
          Write-Host "  🔗 MÁQUINA ONLINE — CONECTE AGORA"
          Write-Host "================================================"
          Write-Host "  IP Tailscale : $ip"
          Write-Host "  Usuário      : dev"
          Write-Host "  Senha        : (a que você definiu)"
          Write-Host "  Porta RDP    : 3389"
          Write-Host ""
          Write-Host "  No seu PC (com Tailscale logado):"
          Write-Host "     mstsc.exe /v:$ip"
          Write-Host "================================================"

      # ============================================================
      # 7. MONITORAMENTO CONTÍNUO — MANTÉM A MÁQUINA ONLINE
      # ============================================================
      - name: Monitoramento Contínuo (mantém online)
        run: |
          Write-Host "🔄 Iniciando monitoramento contínuo..."
          Write-Host "   A máquina ficará online enquanto este step rodar."
          Write-Host ""

          $contador = 0
          while ($true) {
              $contador++

              # Verifica RDP
              $rdp = (Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                -Name "fDenyTSConnections" -ErrorAction SilentlyContinue).fDenyTSConnections
              if ($rdp -ne 0) {
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                    -Name "fDenyTSConnections" -Value 0 -Force
                  Write-Host "⚠️ RDP reabilitado."
              }

              # Verifica serviço do RDP
              $svcRdp = Get-Service -Name "TermService" -ErrorAction SilentlyContinue
              if ($svcRdp -and $svcRdp.Status -ne "Running") {
                  Start-Service -Name "TermService" -ErrorAction SilentlyContinue
                  Write-Host "⚠️ TermService reiniciado."
              }

              # Verifica Tailscale
              $ts = Get-Process -Name "tailscaled" -ErrorAction SilentlyContinue
              if (-not $ts) {
                  Write-Host "⚠️ Tailscale caiu — reiniciando..."
                  Restart-Service -Name "Tailscale" -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 5
                  & "C:\Program Files\Tailscale\tailscale.exe" up `
                    --authkey="$env:TS_AUTHKEY" --unattended 2>$null
              }

              $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4 2>$null
              $uptime = [math]::Round($contador, 0)
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ✅ Online há $uptime min — IP: $ip"

              Start-Sleep -Seconds 60
          }

      # ============================================================
      # 8. LIMPEZA (só roda se algo der errado)
      # ============================================================
      - name: Limpeza Segura
        if: always()
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" down 2>$null
          Remove-Item "$env:TEMP\tailscale.msi" -Force -ErrorAction SilentlyContinue
          Write-Host "Limpeza finalizada."
