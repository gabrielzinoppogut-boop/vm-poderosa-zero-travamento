name: Windows 10 Completo com RTX 3060

on:
  workflow_dispatch:
    inputs:
      refresh_rate:
        description: 'Taxa de Atualizacao'
        required: true
        default: '60'
        type: choice
        options:
          - '60'
          - '75'
          - '120'
          - '144'
      resolution:
        description: 'Resolucao'
        required: true
        default: '1920x1080'
        type: choice
        options:
          - '1280x720'
          - '1920x1080'
          - '2560x1440'

jobs:
  windows-complete:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Verificar Sistema
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "  VERIFICANDO SISTEMA"
          Write-Host "=========================================="
          $ram = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          $cpu = (Get-CimInstance Win32_Processor).Name
          Write-Host "RAM: $ram GB"
          Write-Host "CPU: $cpu"
          Write-Host "=========================================="

      - name: Instalar Chocolatey
        shell: powershell
        run: |
          Write-Host "INSTALANDO CHOCOLATEY"
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          Write-Host "Chocolatey instalado"

      - name: Habilitar Wireless Display e Cast
        shell: powershell
        run: |
          Write-Host "HABILITANDO WIRELESS DISPLAY E CAST"
          Add-WindowsCapability -Online -Name "App.WirelessDisplay.Connect~~~~0.0.1.0" -ErrorAction SilentlyContinue
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Cast" -Force -ErrorAction SilentlyContinue
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Projection" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Cast" -Name "EnableCast" -Value "1" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Cast" -Name "CastEnabled" -Value "1" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Projection" -Name "ProjectionEnabled" -Value "1" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers" -Name "HwSchMode" -Value "2" -Force -ErrorAction SilentlyContinue
          netsh advfirewall firewall add rule name="WiDi-TCP" dir=in action=allow protocol=TCP localport=7250 2>$null
          netsh advfirewall firewall add rule name="WiDi-UDP" dir=in action=allow protocol=UDP localport=5353 2>$null
          netsh advfirewall firewall add rule name="WiDi-RTP" dir=in action=allow protocol=UDP localport=50000-50100 2>$null
          Write-Host "Wireless Display e Cast habilitados"

      - name: Habilitar DLNA
        shell: powershell
        run: |
          Write-Host "HABILITANDO DLNA"
          Set-Service -Name "WMPNetworkSvc" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "WMPNetworkSvc" -ErrorAction SilentlyContinue
          netsh advfirewall firewall set rule group="Descoberta de Rede" new enable=Yes 2>$null
          netsh advfirewall firewall set rule group="Compartilhamento de Arquivo e Impressora" new enable=Yes 2>$null
          netsh advfirewall firewall add rule name="DLNA-TCP" dir=in action=allow protocol=TCP localport=2869 2>$null
          netsh advfirewall firewall add rule name="DLNA-UDP" dir=in action=allow protocol=UDP localport=1900 2>$null
          netsh advfirewall firewall add rule name="DLNA-HTTP" dir=in action=allow protocol=TCP localport=10243 2>$null
          Write-Host "DLNA configurado"

      - name: Instalar Sunshine
        shell: powershell
        run: |
          Write-Host "INSTALANDO SUNSHINE"
          choco install sunshine -y --no-progress
          Write-Host "Sunshine instalado"

      - name: Configurar Portas do Firewall
        shell: powershell
        run: |
          Write-Host "CONFIGURANDO FIREWALL"
          $tcpPorts = @(47984, 47989, 48010, 3389, 2869, 10243, 7250)
          foreach ($port in $tcpPorts) {
              netsh advfirewall firewall delete rule name="Sunshine-TCP-$port" 2>$null
              netsh advfirewall firewall add rule name="Sunshine-TCP-$port" dir=in action=allow protocol=TCP localport=$port 2>$null
          }
          $udpPorts = @(47998, 47999, 48000, 48002, 48010, 1900, 5353)
          foreach ($port in $udpPorts) {
              netsh advfirewall firewall delete rule name="Sunshine-UDP-$port" 2>$null
              netsh advfirewall firewall add rule name="Sunshine-UDP-$port" dir=in action=allow protocol=UDP localport=$port 2>$null
          }
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389 2>$null
          Write-Host "Firewall configurado"

      - name: Habilitar RDP
        shell: powershell
        run: |
          Write-Host "HABILITANDO RDP"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Restart-Service -Name TermService -Force
          Write-Host "RDP habilitado"

      - name: Configurar Para RTX 3060 e DirectX 11
        shell: powershell
        run: |
          Write-Host "CONFIGURANDO PARA RTX 3060"
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers" -Name "HwSchMode" -Value "2" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers" -Name "TdrLevel" -Value "0" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers" -Name "TdrDelay" -Value "10" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\GameBar" -Name "AutoGameModeEnabled" -Value "1" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\GameBar" -Name "AllowAutoGameMode" -Value "1" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling" -Name "PowerThrottlingOff" -Value "1" -Force -ErrorAction SilentlyContinue
          Write-Host "Configurado para RTX 3060 e DirectX 11"

      - name: Otimizar Sistema
        shell: powershell
        run: |
          Write-Host "OTIMIZANDO SISTEMA"
          $servicesToDisable = @(
              "DiagTrack", "dmwappushservice", "MapsBroker", "lfsvc",
              "WSearch", "WMPNetworkSvc", "XboxGipSvc", "XblAuthManager",
              "XblGameSave", "XboxNetApiSvc", "RetailDemo", "RemoteRegistry"
          )
          foreach ($service in $servicesToDisable) {
              Stop-Service -Name $service -Force -ErrorAction SilentlyContinue
              Set-Service -Name $service -StartupType Disabled -ErrorAction SilentlyContinue
          }
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Sistema otimizado"

      - name: Criar Usuario
        shell: powershell
        run: |
          Write-Host "CRIANDO USUARIO"
          Add-Type -AssemblyName System.Web
          $password = [System.Web.Security.Membership]::GeneratePassword(16, 4)
          $password = "Aa1!" + $password.Substring(0, [Math]::Min(12, $password.Length))
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          echo "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          Write-Host "Usuario criado"
          Write-Host "Senha: $password"

      - name: Instalar Tailscale
        shell: powershell
        run: |
          Write-Host "INSTALANDO TAILSCALE"
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i $installerPath /quiet /norestart" -Wait
          Remove-Item $installerPath -Force
          Write-Host "Tailscale instalado"

      - name: Autenticar Tailscale e Mostrar Link
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "  AUTENTICANDO TAILSCALE"
          Write-Host "=========================================="
          Write-Host ""
          
          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          
          # Executar tailscale up e capturar saida
          $output = & $tailscaleExe up --hostname="win-full-$env:GITHUB_RUN_ID" 2>&1
          
          # Procurar por link de autenticacao
          $authLink = ""
          foreach ($line in $output) {
              Write-Host $line
              if ($line -match "https://login\.tailscale\.com") {
                  $authLink = $line.Trim()
              }
          }
          
          # Mostrar link destacado
          if ($authLink) {
              Write-Host ""
              Write-Host "##########################################"
              Write-Host "# LINK DE VERIFICACAO DO TAILSCALE:      #"
              Write-Host "##########################################"
              Write-Host ""
              Write-Host "$authLink"
              Write-Host ""
              Write-Host "##########################################"
              Write-Host ""
              Write-Host "1. Copie o link acima"
              Write-Host "2. Abra no navegador do celular ou PC"
              Write-Host "3. Faca login no Tailscale"
              Write-Host "4. Autorize o dispositivo"
              Write-Host ""
          }
          
          # Aguardar autenticacao
          Write-Host "Aguardando autenticacao (2 minutos)..."
          $authenticated = $false
          $startTime = Get-Date
          
          while (((Get-Date) - $startTime).TotalSeconds -lt 120) {
              $tsIP = & $tailscaleExe ip -4 2>$null
              if ($tsIP -and $tsIP.Trim() -ne "") {
                  $authenticated = $true
                  echo "TAILSCALE_IP=$($tsIP.Trim())" >> $env:GITHUB_ENV
                  Write-Host ""
                  Write-Host "AUTENTICADO COM SUCESSO!"
                  Write-Host "IP: $tsIP"
                  break
              }
              Start-Sleep -Seconds 5
              $elapsed = [math]::Round(((Get-Date) - $startTime).TotalSeconds)
              Write-Host "Aguardando... $elapsed segundos"
          }
          
          if (-not $authenticated) {
              Write-Host "Autenticacao nao completada"
              echo "TAILSCALE_IP=localhost" >> $env:GITHUB_ENV
          }

      - name: Iniciar Sunshine
        shell: powershell
        run: |
          Write-Host "INICIANDO SUNSHINE"
          $sunshinePath = "C:\Program Files\Sunshine\sunshine.exe"
          if (-not (Test-Path $sunshinePath)) {
              $sunshinePath = "C:\Program Files (x86)\Sunshine\sunshine.exe"
          }
          if (-not (Test-Path $sunshinePath)) {
              $sunshinePath = (Get-Command sunshine -ErrorAction SilentlyContinue).Source
          }
          if ($sunshinePath) {
              Start-Process $sunshinePath -WindowStyle Hidden
              Write-Host "Sunshine iniciado"
              Start-Sleep -Seconds 10
          } else {
              Write-Host "Sunshine nao encontrado"
          }

      - name: Manter Ativo
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "   WINDOWS 10 COMPLETO - RTX 3060"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "PARA RDP:"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Usuario: RDP"
          Write-Host "Senha: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "PARA MOONLIGHT:"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Porta: 47989"
          Write-Host ""
          Write-Host "PARA WIRELESS DISPLAY (TV):"
          Write-Host "Pressione Win+K no Windows"
          Write-Host ""
          Write-Host "=========================================="
          $counter = 0
          while ($true) {
              $counter++
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Ativo | Check #$counter"
              Write-Host "RDP: $env:TAILSCALE_IP`:3389"
              Write-Host "Moonlight: $env:TAILSCALE_IP`:47989"
              Start-Sleep -Seconds 300
          }
